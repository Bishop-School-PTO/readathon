<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Readathon</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <script>
    // Fallback for static hosts without rewrites (e.g. GitHub Pages): map pretty URLs to pages.
    (function () {
      var m = location.pathname.match(/^\/(s|d)\/([^/]+)\/?$/);
      // Keep the query string, e.g. /d/<code>?checkout=embedded.
      var extra = location.search ? '&' + location.search.slice(1) : '';
      if (m) location.replace(m[1] === 's' ? '/student.html#' + encodeURIComponent(m[2]) : '/donate.html?c=' + encodeURIComponent(m[2]) + extra);
      else if (/^\/admin\/?$/.test(location.pathname)) location.replace('/admin.html');
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <div class="card" style="text-align:center">
      <img src="/img/book.svg" alt="" height="110">
      <h1>Page not found</h1>
      <p><a href="/">Go to the readathon home page</a></p>
    </div>
  </main>
</body>
</html>
